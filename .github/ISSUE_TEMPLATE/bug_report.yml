name: Bug report
description: Report an incorrect scroll, compatibility problem or application error
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WheelFix. Please include enough detail to reproduce the problem.

  - type: input
    id: mouse
    attributes:
      label: Mouse model
      placeholder: "Example: VXE MAD R Plus"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: application
    attributes:
      label: Affected application
      placeholder: "Example: Chrome, File Explorer or a game"
    validations:
      required: true

  - type: dropdown
    id: strength
    attributes:
      label: Filter setting
      options:
        - Light (25 ms)
        - Balanced (55 ms)
        - Strong (90 ms)
        - Custom value
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the scroll sequence and whether the blocked-pulse counter changed.
      placeholder: I scrolled down three notches, the page moved up once, and the counter...
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest release.
          required: true
        - label: I checked that WheelFix was enabled in the notification area.
          required: true
